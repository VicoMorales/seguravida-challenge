name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SeguraVida.Claims.sln --configfile NuGet.config

      - name: Build
        run: dotnet build SeguraVida.Claims.sln --configuration Release --no-restore

  backend-tests:
    runs-on: windows-latest
    needs: backend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SeguraVida.Claims.sln --configfile NuGet.config

      - name: Test
        run: dotnet test SeguraVida.Claims.sln --configuration Release --no-restore --verbosity normal

  frontend-install:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/seguravida-claims-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: src/frontend/seguravida-claims-web/package-lock.json

      - name: Install
        run: npm ci

  frontend-lint:
    runs-on: ubuntu-latest
    needs: frontend-install

    defaults:
      run:
        working-directory: src/frontend/seguravida-claims-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: src/frontend/seguravida-claims-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-install

    defaults:
      run:
        working-directory: src/frontend/seguravida-claims-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: src/frontend/seguravida-claims-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  docker-build-api:
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build API
        run: docker build -f src/backend/SeguraVida.Claims.Api/Dockerfile -t seguravida-claims-api:ci .

  docker-build-frontend:
    runs-on: ubuntu-latest
    needs:
      - frontend-lint
      - frontend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build Frontend
        run: docker build -f src/frontend/seguravida-claims-web/Dockerfile -t seguravida-claims-web:ci .
